name: install

# Vérifie que les scripts d'installation fonctionnent contre la dernière
# release publiée, sur chaque système.
on:
  push:
    branches: [main]
    paths: [install.sh, install.ps1, .github/workflows/install.yml]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  unix:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: sh install.sh
        env:
          INSTALL_DIR: ${{ runner.temp }}/bin
      - run: test -x "$RUNNER_TEMP/bin/dvf-tui"
      # La commande telle que la documentation la donne, sur le script de ce commit.
      - run: curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/install.sh" | sh
        env:
          INSTALL_DIR: ${{ runner.temp }}/bin-curl
      - run: test -x "$RUNNER_TEMP/bin-curl/dvf-tui"

      # Désinstallation : sans terminal, les données sont conservées ; avec
      # --purge, tout disparaît.
      - name: données factices
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            echo "DONNEES=$HOME/Library/Application Support/dvf-tui" >> "$GITHUB_ENV"
            echo "CACHE=$HOME/Library/Caches/dvf-tui" >> "$GITHUB_ENV"
          else
            echo "DONNEES=$HOME/.local/share/dvf-tui" >> "$GITHUB_ENV"
            echo "CACHE=$HOME/.cache/dvf-tui" >> "$GITHUB_ENV"
          fi
      - run: mkdir -p "$DONNEES/data/Pau/2024" "$CACHE/dvf" && echo x > "$CACHE/dvf/64.csv.gz"
      - run: sh install.sh --uninstall
        env:
          INSTALL_DIR: ${{ runner.temp }}/bin
      - run: test ! -e "$RUNNER_TEMP/bin/dvf-tui" && test -d "$DONNEES" && test -d "$CACHE"
      - run: curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/install.sh" | sh -s -- --uninstall --purge
        env:
          INSTALL_DIR: ${{ runner.temp }}/bin-curl
      - run: test ! -e "$RUNNER_TEMP/bin-curl/dvf-tui" && test ! -e "$DONNEES" && test ! -e "$CACHE"

  windows:
    strategy:
      matrix:
        shell: [powershell, pwsh]
    runs-on: windows-latest
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
      - run: ./install.ps1
        env:
          INSTALL_DIR: ${{ runner.temp }}\bin
      - run: if (-not (Test-Path "$env:RUNNER_TEMP\bin\dvf-tui.exe")) { exit 1 }
      # La commande telle que la documentation la donne, sur le script de ce commit.
      - run: irm "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/install.ps1" | iex
        env:
          INSTALL_DIR: ${{ runner.temp }}\bin-irm
      - run: if (-not (Test-Path "$env:RUNNER_TEMP\bin-irm\dvf-tui.exe")) { exit 1 }

      # Désinstallation : sans console interactive, les données sont
      # conservées ; avec -Purge, tout disparaît, entrée du PATH comprise.
      - run: New-Item -ItemType Directory -Force "$env:LOCALAPPDATA\dvf-tui\data\Pau" | Out-Null; Set-Content "$env:LOCALAPPDATA\dvf-tui\x" "x"
      - run: ./install.ps1 -Uninstall
        env:
          INSTALL_DIR: ${{ runner.temp }}\bin
      - run: |
          if (Test-Path "$env:RUNNER_TEMP\bin\dvf-tui.exe") { throw "binaire encore présent" }
          if (-not (Test-Path "$env:LOCALAPPDATA\dvf-tui")) { throw "données supprimées sans --purge" }
          if (([Environment]::GetEnvironmentVariable("Path", "User") -split ";") -contains "$env:RUNNER_TEMP\bin") { throw "PATH non nettoyé" }
      - run: '& ([scriptblock]::Create((irm "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/install.ps1"))) -Uninstall -Purge'
        env:
          INSTALL_DIR: ${{ runner.temp }}\bin-irm
      - run: |
          if (Test-Path "$env:RUNNER_TEMP\bin-irm\dvf-tui.exe") { throw "binaire encore présent" }
          if (Test-Path "$env:LOCALAPPDATA\dvf-tui") { throw "données non supprimées" }
          if (([Environment]::GetEnvironmentVariable("Path", "User") -split ";") -contains "$env:RUNNER_TEMP\bin-irm") { throw "PATH non nettoyé" }
