name: install

# Vérifie que les scripts d'installation fonctionnent contre la dernière
# release publiée, sur chaque système.
on:
  push:
    branches: [main]
    paths: [install.sh, install.ps1, .github/workflows/install.yml]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  unix:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: sh install.sh
        env:
          INSTALL_DIR: ${{ runner.temp }}/bin
      - run: test -x "$RUNNER_TEMP/bin/dvf-tui"
      # La commande telle que la documentation la donne, sur le script de ce commit.
      - run: curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/install.sh" | sh
        env:
          INSTALL_DIR: ${{ runner.temp }}/bin-curl
      - run: test -x "$RUNNER_TEMP/bin-curl/dvf-tui"

  windows:
    strategy:
      matrix:
        shell: [powershell, pwsh]
    runs-on: windows-latest
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
      - run: ./install.ps1
        env:
          INSTALL_DIR: ${{ runner.temp }}\bin
      - run: if (-not (Test-Path "$env:RUNNER_TEMP\bin\dvf-tui.exe")) { exit 1 }
      # La commande telle que la documentation la donne, sur le script de ce commit.
      - run: irm "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/install.ps1" | iex
        env:
          INSTALL_DIR: ${{ runner.temp }}\bin-irm
      - run: if (-not (Test-Path "$env:RUNNER_TEMP\bin-irm\dvf-tui.exe")) { exit 1 }
